[package]
name = "phyz-dream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Learned surrogate dynamics for phyz rigid body models"
keywords = ["world-model", "surrogate", "dynamics", "physics", "learning"]
categories = ["science", "simulation"]
readme = "README.md"

[features]
default = []
gpu = ["dep:tang-compute"]

[dependencies]
phyz-math = { workspace = true }
phyz-model = { workspace = true }
phyz-rigid = { workspace = true }
tang = { workspace = true }
tang-tensor = { workspace = true }
tang-train = { workspace = true }
tang-safetensors = { workspace = true }
tang-compute = { workspace = true, optional = true }
tang-expr = { workspace = true }
serde = { workspace = true }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
