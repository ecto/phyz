[package]
name = "phyz-camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Headless RGBD camera sensor rendering for the phyz physics engine"
keywords = ["camera", "rgbd", "depth", "wgpu", "simulation"]
categories = ["simulation", "science", "graphics"]
readme = "README.md"

[dependencies]
phyz-math = { workspace = true }
phyz-model = { workspace = true }
phyz-world = { workspace = true }
phyz-collision = { workspace = true }
# Must match phyz-gpu exactly: the two crates share a wgpu Device/Queue, and
# wgpu types are not compatible across versions.
wgpu = "24.0"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"
thiserror = "2.0"

[dev-dependencies]
phyz-urdf = { workspace = true }
phyz-rigid = { workspace = true }
