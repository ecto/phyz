[package]
name = "phyz-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile-checked runnable examples for the phyz workspace (not published)"
publish = false

# This crate exists so that every file under the repository-root `examples/`
# directory is a real cargo target. `cargo build --workspace --examples` then
# type-checks all of them, which is what keeps the documented API honest.
# It ships no library or binary of its own.

[lib]
path = "src/lib.rs"

[dependencies]
phyz = { workspace = true }
phyz-math = { workspace = true }
phyz-model = { workspace = true }
phyz-rigid = { workspace = true }
phyz-diff = { workspace = true }
phyz-collision = { workspace = true }
phyz-contact = { workspace = true }
phyz-compile = { workspace = true }
phyz-coupling = { workspace = true }
phyz-em = { workspace = true }
phyz-format = { workspace = true }
phyz-gpu = { workspace = true }
phyz-gravity = { workspace = true }
phyz-guardian = { workspace = true }
phyz-lbm = { workspace = true }
phyz-particle = { workspace = true }
phyz-real2sim = { workspace = true }
phyz-world = { workspace = true }
phyz-mjcf = { workspace = true }
phyz-prob = { workspace = true }
serde_json.workspace = true
rand = "0.8"
rand_distr = "0.4"

[[example]]
name = "gpu_batch"
path = "../../examples/gpu_batch.rs"

[[example]]
name = "kernel_fusion"
path = "../../examples/kernel_fusion.rs"

