[package]
name = "phyz-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Analytical Jacobians and differentiation for phyz"
keywords = ["differentiable", "physics", "jacobian", "autodiff", "gradients"]
categories = ["simulation", "mathematics", "science"]
readme = "README.md"

[dependencies]
phyz-math.workspace = true
phyz-model.workspace = true
phyz-rigid.workspace = true
phyz-collision.workspace = true
phyz-contact.workspace = true
tang.workspace = true
tang-la.workspace = true
tang-expr.workspace = true
# the Vulkan contact bench (example contact_vulkan): tang-gpu's GLSL path
tang-gpu = { git = "https://github.com/ecto/tang.git", branch = "claude/vulkan-decode", features = ["glsl"], optional = true }

[features]
vulkan = ["dep:tang-gpu"]

[dev-dependencies]
phyz-urdf.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "jacobians"
harness = false

[[example]]
name = "contact_vulkan"
required-features = ["vulkan"]
