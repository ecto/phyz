[package]
name = "phyz-qft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lattice gauge theory with Hybrid Monte Carlo sampling for phyz"
keywords = ["lattice-qft", "gauge-theory", "physics", "monte-carlo", "wilson"]
categories = ["science", "simulation"]
readme = "README.md"

[dependencies]
rand = "0.8"
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
## Update checkerboard link sets in parallel with rayon. Each link has its own
## RNG stream, so results are identical with the feature on or off.
parallel = ["dep:rayon"]

[dev-dependencies]
approx = "0.5"
