[package]
name = "phyz-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmark harness for phyz: throughput, gradients, energy drift, and cross-library comparison"
publish = false

[lib]
name = "phyz_bench"

[[bin]]
name = "phyz-bench"
path = "src/bin/phyz_bench.rs"

# Trajectory dumper for the cross-engine agreement harness. Separate from the
# benchmark binary because it is driven by a Python script, one invocation per
# model, and emits a trajectory rather than a timing report.
[[bin]]
name = "phyz-traj"
path = "src/bin/phyz_traj.rs"

[[bench]]
name = "single_sim"
harness = false

[features]
default = ["rapier"]
# Cross-library comparison against rapier3d (f64 build).
rapier = ["dep:rapier3d-f64"]
# GPU batch suite. Requires a working wgpu adapter at runtime; the suite
# reports `skipped` rather than failing when none is available.
gpu = ["dep:phyz-gpu"]
# The same sweep on phyz-gpu's CUDA path. Builds anywhere; the suite reports
# `skipped` when there is no NVIDIA driver at runtime.
gpu-cuda = ["gpu", "phyz-gpu/cuda"]

[dependencies]
phyz-math.workspace = true
phyz-model.workspace = true
phyz-rigid.workspace = true
phyz-diff.workspace = true
phyz-mjcf.workspace = true
phyz-collision.workspace = true
phyz-contact.workspace = true
# The umbrella crate, for `phyz::determinism` — the reproducibility suite's
# hasher, ulp arithmetic and divergence fit.
phyz.workspace = true
phyz-gpu = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
rapier3d-f64 = { version = "0.34", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
