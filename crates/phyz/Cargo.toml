[package]
name = "phyz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Multi-physics differentiable simulation engine"

[features]
default = ["collision", "contact", "diff"]
collision = ["dep:phyz-collision"]
# Contact resolution runs its own broad/narrow phase, so it implies collision.
contact = ["dep:phyz-contact", "collision"]
diff = ["dep:phyz-diff"]

[dependencies]
phyz-math.workspace = true
phyz-model.workspace = true
phyz-rigid.workspace = true
phyz-collision = { workspace = true, optional = true }
phyz-contact = { workspace = true, optional = true }
phyz-diff = { workspace = true, optional = true }

[dev-dependencies]
approx = "0.5"
