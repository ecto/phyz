[package]
name = "phyz"
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ecto/phyz"
homepage = "https://phyz.dev"
description = "Multi-physics differentiable simulation engine"
keywords = ["physics", "simulation", "differentiable", "robotics", "dynamics"]
categories = ["simulation", "science", "science::robotics"]
readme = "README.md"

[dependencies]
phyz-math.workspace = true
tang = { version = "0.2.0", path = "../../../tang/crates/tang", features = ["std", "la"] }

[dev-dependencies]
approx = "0.5"
