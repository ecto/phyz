name: ci

on:
  # Only main on push — every other branch is covered by pull_request, and
  # listing both there would run each PR twice.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # Every file under examples/ is a target of the phyz-examples crate, so
      # --all-targets is what stops the documented API from rotting.
      - name: Build workspace and examples
        run: cargo build --workspace --all-targets
      # --no-fail-fast: without it cargo stops at the first failing test binary,
      # which hides every failure behind whichever crate happens to fail first.
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast

  # The cross-platform half of the reproducibility contract.
  #
  # `crates/phyz/tests/determinism.rs` carries golden hashes of three
  # contact-rich rollouts. The `test` job above already runs them, but only on
  # one target at one optimization level, which proves nothing about the claim
  # that matters: that a rollout gives *the same bits* on x86-64 and aarch64,
  # under debug and release. Those are the two axes that have actually bitten —
  # a Mac and a Linux box disagreeing on the same candidate, and a champion
  # that stopped reproducing after an unrelated recompile.
  #
  # If this matrix ever goes red on some cells and green on others, the
  # difference is *not* chaos: the inputs are identical, so a divergence is the
  # engine computing different numbers. Start at `docs/determinism.md`.
  determinism:
    name: determinism (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: determinism-${{ matrix.profile }}
      - name: Golden rollout hashes
        run: |
          cargo test -p phyz --test determinism \
            ${{ matrix.profile == 'release' && '--release' || '' }} \
            -- --nocapture
      # The reproducibility control inside the benchmark suite, which steps
      # through `PhyzSim` rather than `Simulator` and so covers the other
      # composition of the same primitives.
      - name: Divergence suite control
        run: cargo test -p phyz-bench --lib divergence

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      # The root README is included as a doc-test of crates/phyz, so its Quick
      # Start is compiled and run by the test job.
      - name: Documentation builds clean
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # MSRV. Edition 2024 sets the floor at 1.85, but the dependency tree raises it
  # to 1.89 (iroh, via tang-mesh). Mirrored as `rust-version` in
  # [workspace.package] so cargo enforces it for consumers — bump both together.
  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: wasm-pack build phyz-wasm
        run: wasm-pack build crates/phyz-wasm --target web --out-dir ../../site/pkg
