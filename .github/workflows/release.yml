name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-phyz:
    name: Publish phyz to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      # The workspace pins `tang` to a git rev (unpublished crates in that repo
      # are needed by other members), but crates.io rejects git deps. We isolate
      # crates/phyz into a standalone package — its own workspace, with tang
      # resolved from the registry — and publish from there.
      - name: Stage isolated phyz package
        run: |
          set -euo pipefail
          mkdir -p /tmp/phyz-publish
          cp -r crates/phyz /tmp/phyz-publish/phyz
          # Replace the workspace-inherited tang dep with a registry dep and
          # make this package its own workspace so cargo doesn't try to load the
          # parent workspace.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("/tmp/phyz-publish/phyz/Cargo.toml")
          src = p.read_text()
          src = re.sub(
              r'^tang = \{[^\n]*\}$',
              'tang = { version = "0.2.0", features = ["std", "la"] }',
              src,
              flags=re.M,
          )
          src = re.sub(
              r'^phyz-math\.workspace = true$',
              'phyz-math = "0.1.0"',
              src,
              flags=re.M,
          )
          # Any remaining path/workspace inheritance would not resolve standalone.
          src = re.sub(r',\s*path\s*=\s*"[^"]*"', "", src)
          if ".workspace = true" in src or "workspace = true" in src:
              raise SystemExit(
                  "unresolved workspace inheritance in isolated package:\n" + src
              )
          if "[workspace]" not in src:
              src = src.rstrip() + "\n\n[workspace]\n"
          p.write_text(src)
          print(src)
          PY

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VER=$(grep -m1 '^version' /tmp/phyz-publish/phyz/Cargo.toml | cut -d'"' -f2)
          echo "tag: $TAG  crate: $CRATE_VER"
          if [ "$TAG" != "$CRATE_VER" ]; then
            echo "::error::tag v$TAG does not match crates/phyz/Cargo.toml version $CRATE_VER"
            exit 1
          fi

      - name: cargo publish --dry-run
        working-directory: /tmp/phyz-publish/phyz
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run

      - name: cargo publish
        working-directory: /tmp/phyz-publish/phyz
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
