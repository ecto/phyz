name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish phyz crates to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      # Every workspace crate shares [workspace.package] version, so checking
      # the umbrella is equivalent to checking all of them.
      - name: Verify tag matches workspace version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VER=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='phyz'))")
          echo "tag: $TAG  crate: $CRATE_VER"
          if [ "$TAG" != "$CRATE_VER" ]; then
            echo "::error::tag v$TAG does not match workspace version $CRATE_VER"
            exit 1
          fi

      # Dependency order: math -> model -> rigid -> collision -> contact,
      # diff -> phyz. `cargo publish` rewrites the path entries of
      # [workspace.dependencies] to plain registry deps on upload, so each
      # crate resolves its phyz-* deps from the versions published just above.
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in phyz-math phyz-model phyz-rigid phyz-collision \
                       phyz-contact phyz-diff phyz; do
            echo "::group::publish $crate"
            cargo publish -p "$crate"
            # Give the index a moment to serve the new version to the next crate.
            sleep 30
            echo "::endgroup::"
          done
